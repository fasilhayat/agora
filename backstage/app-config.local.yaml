# Local overrides for the containerized developer portal.
# Loaded automatically by Backstage in addition to app-config.yaml.
app:
  baseUrl: http://localhost:3000
  listen:
    host: 0.0.0.0
    port: 3000

backend:
  baseUrl: http://localhost:7007
  listen:
    host: 0.0.0.0
    port: 7007
  cors:
    origin: http://localhost:3000
  auth:
    dangerouslyDisableDefaultAuthPolicy: true
  reading:
    allow:
      - host: governance

catalog:
  locations:
    - type: url
      target: http://governance/apis/sample-orders-api/catalog-info.yaml
      rules:
        - allow: [API]
    - type: url
      target: http://governance/apis/tiwaz-bonds-api/catalog-info.yaml
      rules:
        - allow: [API]
