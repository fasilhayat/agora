services:
  governance:
    image: nginx:alpine
    container_name: governance
    ports:
      - "8081:80"
    volumes:
      - ./governance/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./governance/shared-models.yaml:/usr/share/nginx/html/shared-models.yaml:ro
      - ./apis:/usr/share/nginx/html/apis:ro
    restart: unless-stopped

  swagger-editor:
    image: docker.swagger.io/swaggerapi/swagger-editor
    container_name: swagger-editor
    ports:
      - "8082:80"
    restart: unless-stopped

  backstage:
    build:
      context: ./backstage
      dockerfile: Dockerfile
    container_name: backstage
    ports:
      - "3000:3000"
      - "7007:7007"
    volumes:
      - ./backstage/app-config.local.yaml:/app/app-config.local.yaml:ro
      - ./apis:/app/apis:ro
    depends_on:
      - governance
    restart: unless-stopped
