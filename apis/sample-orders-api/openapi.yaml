openapi: 3.0.3
info:
  title: Sample Orders API
  description: Draft API contract managed through the API editor and registered in the developer portal catalog.
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /orders:
    get:
      summary: List orders
      operationId: listOrders
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
components:
  schemas:
    Order:
      type: object
      required:
        - id
        - customer
      properties:
        id:
          type: string
          format: uuid
        customer:
          $ref: 'http://localhost:8081/shared-models.yaml#/components/schemas/Customer'
        total:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time
