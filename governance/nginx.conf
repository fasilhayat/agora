worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Serve YAML with a sane content type instead of octet-stream.
    types {
        text/yaml yaml yml;
    }

    server {
        listen       80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        autoindex on;

        location / {
            # CORS: allow all origins for the governance artifacts so the
            # API editor and developer portal (running on other ports)
            # can fetch them directly from the browser.
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                add_header 'Access-Control-Allow-Headers' '*';
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                return 204;
            }

            try_files $uri $uri/ =404;
        }
    }
}
