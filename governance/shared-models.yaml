openapi: 3.0.3
info:
  title: Shared Data Models
  description: >
    Canonical, governed data models shared across the organization's APIs.
    This file is published by the Data Governance platform (stand-in for
    Collibra/DataGalaxy) and is referenced by downstream API contracts via
    $ref.
  version: 1.0.0
paths: {}
components:
  schemas:
    Customer:
      type: object
      description: Canonical Customer model, owned and governed centrally.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the customer.
        name:
          type: string
          description: Full name of the customer.
        email:
          type: string
          format: email
          description: Primary contact email of the customer.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the customer record was created.
