<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1872c4"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" fill="#1c2026" font-size="18" font-weight="700">Implementation Roadmap — Build Order</text>

  <!-- vertical line -->
  <line x1="90" y1="80" x2="90" y2="470" stroke="#c7cdd6" stroke-width="3"/>

  <!-- step 1 -->
  <circle cx="90" cy="100" r="14" fill="#1e8f5f"/>
  <text x="90" y="105" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text>
  <rect x="130" y="70" width="700" height="70" rx="8" fill="#f3f5f8" stroke="#1e8f5f"/>
  <text x="150" y="95" fill="#1c2026" font-size="14" font-weight="600">Spectral ruleset + CI gate</text>
  <text x="150" y="115" fill="#5b6472" font-size="12">Zero governance-integration dependency. Highest ROI. Already proved against Tiwaz.</text>
  <text x="150" y="131" fill="#5b6472" font-size="12">Start here.</text>

  <!-- step 2 -->
  <circle cx="90" cy="190" r="14" fill="#1872c4"/>
  <text x="90" y="195" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text>
  <rect x="130" y="160" width="700" height="70" rx="8" fill="#f3f5f8" stroke="#1872c4"/>
  <text x="150" y="185" fill="#1c2026" font-size="14" font-weight="600">Contract repo convention</text>
  <text x="150" y="205" fill="#5b6472" font-size="12">Decide where each service's openapi.yaml/json lives and publish it as a CI artifact.</text>

  <!-- step 3 -->
  <circle cx="90" cy="280" r="14" fill="#1872c4"/>
  <text x="90" y="285" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text>
  <rect x="130" y="250" width="700" height="70" rx="8" fill="#f3f5f8" stroke="#1872c4"/>
  <text x="150" y="275" fill="#1c2026" font-size="14" font-weight="600">Shared-schema publishing (the Collibra piece)</text>
  <text x="150" y="295" fill="#5b6472" font-size="12">Export approved definitions as HTTP-served schema files, $ref'd by contracts.</text>

  <!-- step 4 -->
  <circle cx="90" cy="370" r="14" fill="#5b6472"/>
  <text x="90" y="375" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text>
  <rect x="130" y="340" width="700" height="70" rx="8" fill="#f3f5f8" stroke="#c7cdd6"/>
  <text x="150" y="365" fill="#1c2026" font-size="14" font-weight="600">Catalog (Backstage)</text>
  <text x="150" y="385" fill="#5b6472" font-size="12">Discoverability on top of artifacts from steps 1-3. Not a dependency of them.</text>

  <!-- step 5 -->
  <circle cx="90" cy="460" r="14" fill="#c0691a"/>
  <text x="90" y="465" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">5</text>
  <rect x="130" y="430" width="700" height="70" rx="8" fill="#f3f5f8" stroke="#c0691a"/>
  <text x="150" y="455" fill="#1c2026" font-size="14" font-weight="600">Governance approval workflow</text>
  <text x="150" y="475" fill="#5b6472" font-size="12">AI drafts definitions, Data Governance approves. Small service in front of step 3's registry.</text>
</svg>
