<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1872c4"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" fill="#1c2026" font-size="18" font-weight="700">Agora Stack — Standard Components, Composed</text>

  <!-- governance -->
  <rect x="40" y="90" width="230" height="110" rx="10" fill="#f3f5f8" stroke="#c0691a"/>
  <text x="155" y="118" text-anchor="middle" fill="#c0691a" font-size="12">EMULATED (only piece)</text>
  <text x="155" y="140" text-anchor="middle" fill="#1c2026" font-size="15" font-weight="600">governance (nginx)</text>
  <text x="155" y="160" text-anchor="middle" fill="#5b6472" font-size="11">stand-in: Collibra / DataGalaxy</text>
  <text x="155" y="178" text-anchor="middle" fill="#5b6472" font-size="11">serves shared-models.yaml</text>
  <text x="155" y="194" text-anchor="middle" fill="#5b6472" font-size="11">:8081</text>

  <!-- swagger editor -->
  <rect x="335" y="90" width="230" height="110" rx="10" fill="#f3f5f8" stroke="#1e8f5f"/>
  <text x="450" y="118" text-anchor="middle" fill="#1e8f5f" font-size="12">REAL TOOL, not emulated</text>
  <text x="450" y="140" text-anchor="middle" fill="#1c2026" font-size="15" font-weight="600">Swagger Editor</text>
  <text x="450" y="160" text-anchor="middle" fill="#5b6472" font-size="11">design-first contract authoring</text>
  <text x="450" y="178" text-anchor="middle" fill="#5b6472" font-size="11">docker.swagger.io image</text>
  <text x="450" y="194" text-anchor="middle" fill="#5b6472" font-size="11">:8082</text>

  <!-- backstage -->
  <rect x="630" y="90" width="230" height="110" rx="10" fill="#f3f5f8" stroke="#1e8f5f"/>
  <text x="745" y="118" text-anchor="middle" fill="#1e8f5f" font-size="12">REAL TOOL, not emulated</text>
  <text x="745" y="140" text-anchor="middle" fill="#1c2026" font-size="15" font-weight="600">Backstage</text>
  <text x="745" y="160" text-anchor="middle" fill="#5b6472" font-size="11">developer portal / catalog</text>
  <text x="745" y="178" text-anchor="middle" fill="#5b6472" font-size="11">:3000 UI / :7007 API</text>

  <!-- git -->
  <rect x="335" y="250" width="230" height="90" rx="10" fill="#f3f5f8" stroke="#1872c4"/>
  <text x="450" y="278" text-anchor="middle" fill="#1c2026" font-size="15" font-weight="600">Git / GitHub</text>
  <text x="450" y="298" text-anchor="middle" fill="#5b6472" font-size="11">apis/*, catalog-info.yaml</text>
  <text x="450" y="316" text-anchor="middle" fill="#5b6472" font-size="11">source of truth, PR review</text>

  <!-- spectral -->
  <rect x="630" y="250" width="230" height="90" rx="10" fill="#f3f5f8" stroke="#1872c4"/>
  <text x="745" y="278" text-anchor="middle" fill="#1c2026" font-size="15" font-weight="600">Spectral</text>
  <text x="745" y="298" text-anchor="middle" fill="#5b6472" font-size="11">.spectral.yaml ruleset</text>
  <text x="745" y="316" text-anchor="middle" fill="#5b6472" font-size="11">local CLI + CI gate, same file</text>

  <line x1="270" y1="145" x2="335" y2="145" stroke="#1872c4" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="300" y="135" text-anchor="middle" fill="#5b6472" font-size="10">$ref</text>

  <line x1="450" y1="200" x2="450" y2="250" stroke="#1872c4" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="465" y="230" fill="#5b6472" font-size="10">commit</text>

  <line x1="565" y1="295" x2="630" y2="295" stroke="#1872c4" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="598" y="285" text-anchor="middle" fill="#5b6472" font-size="10">lint</text>

  <line x1="565" y1="145" x2="630" y2="145" stroke="#1872c4" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="598" y="135" text-anchor="middle" fill="#5b6472" font-size="10">catalog</text>

  <line x1="450" y1="340" x2="450" y2="90" stroke="#c7cdd6" stroke-width="1.5" stroke-dasharray="4,4"/>

  <text x="450" y="390" text-anchor="middle" fill="#5b6472" font-size="12">Only "governance" is a stand-in. Editor, portal, lint engine, and Git are the real, unmodified tools.</text>
</svg>
