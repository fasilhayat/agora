<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1872c4"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>

  <text x="450" y="30" text-anchor="middle" fill="#1c2026" font-size="18" font-weight="700">Current State — Sparse, Unsupported Tooling</text>

  <!-- editors -->
  <rect x="30" y="70" width="170" height="60" rx="8" fill="#f3f5f8" stroke="#c7cdd6"/>
  <text x="115" y="95" text-anchor="middle" fill="#1c2026" font-size="13">VS Code /</text>
  <text x="115" y="113" text-anchor="middle" fill="#1c2026" font-size="13">Notepad++</text>

  <rect x="30" y="160" width="170" height="70" rx="8" fill="#f3f5f8" stroke="#c0691a"/>
  <text x="115" y="185" text-anchor="middle" fill="#1c2026" font-size="12">Company X</text>
  <text x="115" y="201" text-anchor="middle" fill="#1c2026" font-size="12">OpenAPI Editor</text>
  <text x="115" y="217" text-anchor="middle" fill="#c0691a" font-size="11">(unsupported)</text>

  <rect x="30" y="270" width="170" height="60" rx="8" fill="#f3f5f8" stroke="#c7cdd6"/>
  <text x="115" y="295" text-anchor="middle" fill="#1c2026" font-size="13">SwaggerHub</text>
  <text x="115" y="313" text-anchor="middle" fill="#5b6472" font-size="11">(SaaS, licensed)</text>

  <!-- repo -->
  <rect x="320" y="150" width="190" height="90" rx="8" fill="#f3f5f8" stroke="#1872c4"/>
  <text x="415" y="180" text-anchor="middle" fill="#1c2026" font-size="14" font-weight="600">Git Repository</text>
  <text x="415" y="200" text-anchor="middle" fill="#5b6472" font-size="11">OpenAPI / Event files</text>
  <text x="415" y="218" text-anchor="middle" fill="#c43d3d" font-size="11">commit author lost via webhook</text>

  <!-- APIM -->
  <rect x="650" y="150" width="200" height="90" rx="8" fill="#f3f5f8" stroke="#c7cdd6"/>
  <text x="750" y="180" text-anchor="middle" fill="#1c2026" font-size="14" font-weight="600">APIM</text>
  <text x="750" y="200" text-anchor="middle" fill="#5b6472" font-size="11">Azure API Management</text>
  <text x="750" y="218" text-anchor="middle" fill="#5b6472" font-size="11">Package &amp; Deploy</text>

  <!-- DB -->
  <rect x="320" y="330" width="190" height="60" rx="8" fill="#f3f5f8" stroke="#c7cdd6"/>
  <text x="415" y="365" text-anchor="middle" fill="#1c2026" font-size="13">Misc. file editors / DB</text>

  <!-- arrows -->
  <line x1="200" y1="100" x2="320" y2="175" stroke="#1872c4" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="200" y1="195" x2="320" y2="195" stroke="#1872c4" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="200" y1="300" x2="320" y2="220" stroke="#c43d3d" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow1)"/>
  <text x="255" y="270" fill="#c43d3d" font-size="11">webhook push</text>

  <line x1="510" y1="195" x2="650" y2="195" stroke="#1872c4" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="560" y="185" text-anchor="middle" fill="#5b6472" font-size="11">commit/push</text>

  <line x1="415" y1="240" x2="415" y2="330" stroke="#c7cdd6" stroke-width="2" marker-end="url(#arrow1)"/>

  <text x="450" y="430" text-anchor="middle" fill="#5b6472" font-size="12">No governance validation. No single source of truth. Attribution lost at the SwaggerHub→Git boundary.</text>
</svg>
